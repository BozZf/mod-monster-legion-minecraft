name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon build
      - name: Verify dedicated server bootstrap
        shell: bash
        run: |
          set -o pipefail
          timeout 180s ./gradlew --no-daemon runServer --args=nogui | tee server-bootstrap.log
          grep -F 'Monster Legion initialized' run/logs/latest.log
          grep -F 'You need to agree to the EULA' run/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: monster-legion
          path: build/libs/*.jar
